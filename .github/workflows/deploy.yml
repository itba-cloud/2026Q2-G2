# Manual. Brings everything up from an empty account in one run: creates the
# state bucket if missing, pushes the workers' image if its code changed,
# applies (with the optional SEPA_API_URL secret for the ingestion),
# publishes the portal to its bucket, puts the platform admin in Cognito
# (with the BOOTSTRAP_* secrets), checks that the API answers and writes the
# URLs to the job summary. Running it again over a live
# deploy only applies what changed.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm.
        required: true

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'deploy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          echo "::error::Type \"deploy\" to confirm; got \"$CONFIRM\"."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Init
        run: make init

      # Creates the ECR repository first if missing (a targeted apply), and
      # builds and pushes only when ECR lacks this code's tag.
      - name: Push the workers' image
        run: make worker-push

      # The SEPA proxy's tunnel, for the ingestion's daily cron. Optional:
      # without the secret the apply is the same and only the ingestion
      # fails, saying the proxy is missing. The platform admin's email gets
      # the failed chains (SNS first asks it to confirm the subscription).
      - name: Plan
        env:
          TF_VAR_sepa_api_url: ${{ secrets.SEPA_API_URL }}
          TF_VAR_admin_email: ${{ secrets.BOOTSTRAP_EMAIL }}
        run: make plan

      - name: Apply
        run: make apply

      # After the apply: the bucket and its config.json are Terraform's.
      - name: Publish the portal
        run: make portal-publish

      # Into the user pool the apply created. Nothing without BOOTSTRAP_EMAIL;
      # an admin from an earlier Deploy is kept, with the secret's password.
      - name: Platform admin
        env:
          BOOTSTRAP_EMAIL: ${{ secrets.BOOTSTRAP_EMAIL }}
          BOOTSTRAP_PASSWORD: ${{ secrets.BOOTSTRAP_PASSWORD }}
        run: make bootstrap-platform-admin

      - name: Check the API
        run: |
          api="$(terraform -chdir=infra output -raw api_endpoint)"
          echo "API_ENDPOINT=$api" >> "$GITHUB_ENV"
          echo "DATA_BUCKET=$(terraform -chdir=infra output -raw data_bucket_name)" >> "$GITHUB_ENV"
          echo "PORTAL_URL=$(terraform -chdir=infra output -raw portal_url)" >> "$GITHUB_ENV"
          # A Lambda inside a VPC can take a few seconds on its first cold start.
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            "$api/api/health"

      - name: Summary
        run: |
          {
            echo "## LGDC desplegado"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Portal | $PORTAL_URL |"
            echo "| API | $API_ENDPOINT |"
            echo "| Health | $API_ENDPOINT/api/health |"
            echo "| Bucket de datos | \`s3://$DATA_BUCKET/raw/\` |"
          } >> "$GITHUB_STEP_SUMMARY"
